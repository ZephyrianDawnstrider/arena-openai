name: Package Arena skill

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate release version and create skill archive
        run: python scripts/package_skill.py --tag "$GITHUB_REF_NAME" --output-dir dist
      - name: Upload skill archive
        uses: actions/upload-artifact@v4
        with:
          name: arena-skill-${{ github.event.release.tag_name }}
          path: dist/arena-skill-*.zip
          if-no-files-found: error
